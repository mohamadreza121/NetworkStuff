---
- name: Back up Cisco IOS running configurations
  hosts: ios
  gather_facts: false

  tasks:
    - name: Collect running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: running_config

    - name: Write one deterministic backup per device
      ansible.builtin.copy:
        content: "{{ running_config.stdout[0] }}\n"
        dest: "backups/{{ inventory_hostname }}.cfg"
        mode: "0600"
      delegate_to: localhost
